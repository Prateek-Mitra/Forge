// ─── scoring (50% streak threshold, bucket-based) ────────────────────────────
const activeFor=cfg=>cfg.habits;
const scoredFor=cfg=>activeFor(cfg).filter(h=>!h.optional&&h.points>0);

function bucketScore(cfg,log,bucketName){
  const hs=scoredFor(cfg).filter(h=>h.category===bucketName);
  const tot=hs.reduce((s,h)=>s+h.points,0);
  if(!tot)return null;
  let earn=0;
  hs.forEach(h=>{const v=log?log[h.id]:undefined;if(h.type==="counter"){if(typeof v==="number"&&v>=h.target)earn+=h.points;else if(typeof v==="number")earn+=h.points*Math.min(1,v/h.target);}else if(v===true)earn+=h.points;});
  return Math.round((earn/tot)*100);
}

function dayScore(cfg,log){
  const activeBuckets=BUCKETS.map(b=>bucketScore(cfg,log,b.name)).filter(s=>s!==null);
  if(!activeBuckets.length)return 0;
  return Math.round(activeBuckets.reduce((a,b)=>a+b,0)/activeBuckets.length);
}

function bucketWins(cfg,log){
  return BUCKETS.filter(b=>{const s=bucketScore(cfg,log,b.name);return s!==null&&s>=70;}).length;
}
function totalActiveBuckets(cfg){
  return BUCKETS.filter(b=>scoredFor(cfg).some(h=>h.category===b.name)).length;
}

// 50% threshold for streak
const lbl=s=>s>=95?{l:"Elite Day",c:T.ember}:s>=85?{l:"Great Day",c:T.ember}:s>=70?{l:"Good Day",c:T.steel}:s>=50?{l:"Active Day",c:T.steel}:{l:"Missed",c:T.textTertiary};
function curStreak(cfg,logs,end){let n=0,c=end;for(let i=0;i<3650;i++){if(dayScore(cfg,logs[c])>=50){n++;c=addDays(c,-1);}else break;}return n;}
function longestStreak(cfg,logs){const ks=Object.keys(logs).sort();let lng=0,cur=0,p=null;ks.forEach(k=>{if(dayScore(cfg,logs[k])>=50){cur=(p&&addDays(p,1)===k)?cur+1:1;lng=Math.max(lng,cur);}else cur=0;p=k;});return lng;}
function heatCol(s){if(s==null)return T.borderSoft;if(s>=95)return"#FFE9D6";if(s>=85)return T.ember;if(s>=70)return"#B9683B";if(s>=50)return T.steel;return T.miss;}

// ─── ForgeRing ────────────────────────────────────────────────────────────────
function ForgeRing({score,size=148}){
  const stroke=12,r=(size-stroke)/2,c=2*Math.PI*r,dash=(score/100)*c;
  const hc=score>=90?"#FFE9D6":score>=70?T.ember:score>=40?"#D97A46":T.steel;
  const glow=Math.min(1,score/100);
  return (
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.borderSoft} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={hc} strokeWidth={stroke}
          strokeDasharray={`${dash} ${c}`} strokeLinecap="round"
          style={{filter:`drop-shadow(0 0 ${6+glow*14}px ${hc})`,transition:"stroke-dasharray .6s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <div style={{fontFamily:mf,fontSize:size>100?34:24,fontWeight:700,color:T.textPrimary,lineHeight:1}}>{score}</div>
        <div style={{fontFamily:mf,fontSize:11,color:T.textTertiary,marginTop:4,letterSpacing:1}}>/ 100</div>
      </div>
    </div>
  );
}

function HabitRow({habit,value,onToggle,onCounter}){
  const done=habit.type==="counter"?(value>=habit.target):value===true;
  return (
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderBottom:`1px solid ${T.borderSoft}`}}>
      <div style={{width:32,height:32,borderRadius:10,background:T.surfaceRaised,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        <HIcon name={habit.icon} size={17} color={done?T.ember:T.textSecondary}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontFamily:df,fontSize:13.5,fontWeight:500,color:T.textPrimary}}>{habit.name}</div>
        {habit.optional&&<div style={{fontFamily:mf,fontSize:10,color:T.textTertiary}}>optional</div>}
      </div>
      {habit.type==="counter"?(
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <input type="number" value={value||""} placeholder="0" onChange={e=>onCounter(Number(e.target.value))}
            style={{width:52,background:T.surfaceRaised,border:`1px solid ${T.border}`,borderRadius:8,color:T.textPrimary,fontFamily:mf,fontSize:12,padding:"6px",textAlign:"center",outline:"none"}}/>
          <span style={{fontFamily:mf,fontSize:11,color:T.textTertiary}}>{habit.unit}</span>
        </div>
      ):(
        <button onClick={onToggle} style={{width:28,height:28,borderRadius:"50%",flexShrink:0,cursor:"pointer",

// ─── Protein Sources multi-select ────────────────────────────────────────────
const PROTEIN_SOURCES=["Chicken","Paneer","Boiled Egg","Protein/Oat Shake","Fish","Other"];
function ProteinSources({value,onChange}){
  const selected=value||[];
  const toggle=src=>{
    const next=selected.includes(src)?selected.filter(s=>s!==src):[...selected,src];
    onChange(next);
  };
  return (
    <div style={{padding:"12px 16px",borderBottom:`1px solid ${T.borderSoft}`}}>
      <div style={{fontFamily:df,fontSize:12,color:T.textTertiary,marginBottom:8}}>Protein sources today</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
        {PROTEIN_SOURCES.map(src=>{
          const on=selected.includes(src);
          return (
            <button key={src} onClick={()=>toggle(src)}
              style={{padding:"5px 11px",borderRadius:999,fontSize:12,fontFamily:df,cursor:"pointer",
                border:`1.5px solid ${on?T.ember:T.border}`,
                background:on?T.emberSoft:"transparent",
                color:on?T.ember:T.textSecondary,transition:"all .12s"}}>
              {src}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── BucketCard — win bucket with mini progress bar ──────────────────────────
function BucketCard({bucket,habits,log,onToggle,onCounter,onProteinSources}){
  const [open,setOpen]=React.useState(true);
  const scored=habits.filter(h=>!h.optional&&h.points>0);
  const tot=scored.reduce((s,h)=>s+h.points,0);
  let earn=0;
  scored.forEach(h=>{const v=log[h.id];if(h.type==="counter"){if(typeof v==="number"&&v>=h.target)earn+=h.points;else if(typeof v==="number")earn+=h.points*Math.min(1,v/h.target);}else if(v===true)earn+=h.points;});
  const pct=tot?Math.round((earn/tot)*100):0;
  const won=pct>=70;
  const doneCount=scored.filter(h=>h.type==="counter"?(log[h.id]>=h.target):log[h.id]===true).length;
  const bucketColor=won?T.ember:pct>=50?T.steel:T.textTertiary;
  const showProtein=bucket.name==="Physical Win";

  return (
    <div style={{background:T.surface,border:`1px solid ${won?T.ember+"44":T.border}`,borderRadius:20,overflow:"hidden",
      boxShadow:won?`0 0 16px ${T.emberSoft}`:"none",transition:"box-shadow .3s"}}>
      {/* bucket header */}
      <button onClick={()=>setOpen(v=>!v)}
        style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"14px 16px",background:"transparent",border:"none",cursor:"pointer"}}>
        <div style={{fontSize:18,lineHeight:1}}>{bucket.emoji}</div>
        <div style={{flex:1,textAlign:"left"}}>
          <div style={{fontFamily:df,fontWeight:700,fontSize:14,color:T.textPrimary}}>{bucket.name}</div>
          <div style={{marginTop:5,height:4,background:T.surfaceRaised,borderRadius:999,overflow:"hidden",width:"100%"}}>
            <div style={{width:`${pct}%`,height:"100%",background:bucketColor,borderRadius:999,transition:"width .5s ease"}}/>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2,flexShrink:0}}>
          <div style={{fontFamily:mf,fontSize:13,fontWeight:700,color:bucketColor}}>{pct}%</div>
          <div style={{fontFamily:mf,fontSize:10,color:T.textTertiary}}>{doneCount}/{scored.length}</div>
        </div>
        {won&&<div style={{fontSize:14}}>🏆</div>}
        <Icon name={open?"chevron_d":"chevron_r"} size={15} color={T.textTertiary}/>
      </button>

      {/* habit rows */}
      {open&&(
        <div style={{borderTop:`1px solid ${T.borderSoft}`}}>
          {habits.map(h=>(
            <HabitRow key={h.id} habit={h} value={log[h.id]} onToggle={()=>onToggle(h.id,h)} onCounter={v=>onCounter(h.id,v)}/>
          ))}
          {showProtein&&(
            <ProteinSources value={log.__proteinSources} onChange={v=>onProteinSources(v)}/>
          )}
        </div>
      )}
    </div>
  );
}
  return (
    <Card style={{flex:1,display:"flex",flexDirection:"column",gap:8}}>
      {icon}
      <div style={{fontFamily:mf,fontWeight:700,fontSize:20,color:T.textPrimary}}>{value}</div>
      <div style={{fontFamily:df,fontSize:11.5,color:T.textTertiary}}>{label}</div>
    </Card>
  );
}

// ─── CalHeat ─────────────────────────────────────────────────────────────────
function CalHeat({config,logs,weeks=12}){
  const days=[];let c=todayKey();
  for(let i=0;i<weeks*7;i++){days.unshift(c);c=addDays(c,-1);}
  const grid=[];for(let i=0;i<weeks;i++)grid.push(days.slice(i*7,i*7+7));
  return (
    <div style={{display:"flex",gap:3,overflowX:"auto",paddingBottom:4}}>
      {grid.map((col,ci)=>(
        <div key={ci} style={{display:"flex",flexDirection:"column",gap:3}}>
          {col.map(k=>{const s=logs[k]?dayScore(config,logs[k]):null;return(
            <div key={k} title={`${k}: ${s==null?"—":s+"%"}`} style={{width:11,height:11,borderRadius:3,background:heatCol(s)}}/>
          );})}
        </div>
      ))}
    </div>
  );
}

  const rmG=id=>setConfig({...config,goals:config.goals.filter(g=>g.id!==id)});

  const goalCats=React.useMemo(()=>{
    const s=new Set(["Career","Fitness","Spiritual","Content","Lifestyle","Growth"]);
    config.goals.forEach(g=>{if(g.category)s.add(g.category);});
    return[...s];
  },[config.goals]);

  const addG=()=>{
    if(!ng.trim())return;
    const finalCat=ngCustomCat.trim()||ngCat;
    setConfig({...config,goals:[...config.goals,{id:"g"+Date.now(),name:ng.trim(),category:finalCat,progress:0}]});
    setNg("");setNgCat("Career");setNgCustomCat("");setShowForm(false);
  };

  const grp={};config.goals.forEach(g=>{(grp[g.category]=grp[g.category]||[]).push(g);});
  const inp={background:T.surfaceRaised,border:`1px solid ${T.border}`,borderRadius:10,color:T.textPrimary,fontFamily:df,fontSize:13,padding:"10px 12px",outline:"none",width:"100%"};
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <ST>Long-Term Goals</ST>
      {Object.entries(grp).map(([cat,items])=>(
        <Card key={cat}>
          <div style={{fontFamily:df,fontWeight:700,fontSize:13,color:T.textPrimary,marginBottom:12}}>{cat}</div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {items.map(g=>(
              <div key={g.id}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontFamily:df,fontSize:13,color:T.textPrimary,flex:1,marginRight:8}}>{g.name}</span>
                  <button onClick={()=>rmG(g.id)} style={{background:"none",border:"none",cursor:"pointer",padding:2,flexShrink:0}}><Icon name="x" size={13} color={T.textTertiary}/></button>
                </div>
                <input type="range" min={0} max={100} value={g.progress} onChange={e=>upG(g.id,Number(e.target.value))} style={{width:"100%",accentColor:T.ember}}/>
                <div style={{fontFamily:mf,fontSize:11,color:T.textTertiary,textAlign:"right",marginTop:2}}>{g.progress}%</div>
              </div>
            ))}
          </div>
        </Card>
      ))}

      {!showForm?(
        <button onClick={()=>setShowForm(true)}
          style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"13px",borderRadius:16,background:"transparent",border:`1.5px dashed ${T.border}`,cursor:"pointer",width:"100%"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=T.ember}
          onMouseLeave={e=>e.currentTarget.style.borderColor=T.border}>
          <Icon name="plus" size={16} color={T.ember}/>
          <span style={{fontFamily:df,fontSize:13,color:T.ember,fontWeight:600}}>Add Goal</span>
        </button>
      ):(
        <Card style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{fontFamily:df,fontWeight:700,fontSize:15,color:T.textPrimary}}>New Goal</div>
          <input value={ng} onChange={e=>setNg(e.target.value)} placeholder="What do you want to achieve?" onKeyDown={e=>e.key==="Enter"&&addG()} style={inp} autoFocus/>
          <div>
            <div style={{fontFamily:df,fontSize:12,color:T.textTertiary,marginBottom:6}}>Category</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
              {goalCats.map(c=>(
                <button key={c} onClick={()=>{setNgCat(c);setNgCustomCat("");}}
                  style={{padding:"5px 13px",borderRadius:999,fontSize:12,fontFamily:df,cursor:"pointer",border:"none",
                    background:ngCat===c&&!ngCustomCat?T.ember:T.surfaceRaised,
                    color:ngCat===c&&!ngCustomCat?"#0D0E10":T.textSecondary}}>
                  {c}
                </button>
              ))}
            </div>
            <input value={ngCustomCat} onChange={e=>setNgCustomCat(e.target.value)} placeholder="Or create a new category…"
              style={{...inp,fontSize:12,padding:"8px 12px"}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setShowForm(false);setNg("");setNgCustomCat("");}}
              style={{flex:1,padding:"11px",borderRadius:12,background:"transparent",border:`1px solid ${T.border}`,color:T.textSecondary,fontFamily:df,fontSize:12,cursor:"pointer"}}>
              Cancel
            </button>
            <button onClick={addG}
              style={{flex:2,padding:"11px",borderRadius:12,background:T.ember,border:"none",color:"#0D0E10",fontFamily:df,fontWeight:700,fontSize:13,cursor:"pointer"}}>
              Save Goal
            </button>
          </div>
        </Card>
      )}

      <ST>Rewards</ST>
      <Card style={{display:"flex",flexDirection:"column",gap:12}}>
        {config.rewards.map(r=>{const u=elite>=r.threshold;return(
          <div key={r.id} style={{display:"flex",alignItems:"center",gap:12,opacity:u?1:.5}}>
            <Icon name={u?"unlock":"lock"} size={16} color={u?T.ember:T.textTertiary}/>
            <div style={{flex:1}}>
              <div style={{fontFamily:df,fontSize:13,color:T.textPrimary}}>{r.name}</div>
              <div style={{fontFamily:mf,fontSize:10.5,color:T.textTertiary}}>{r.note}</div>
            </div>
            <Pill color={u?T.ember:T.textTertiary}>{Math.min(elite,r.threshold)}/{r.threshold}</Pill>
          </div>
        );})}
      </Card>
    </div>
  );
}

// ─── REVIEWS TAB ──────────────────────────────────────────────────────────────
const RR=({label,value})=>(
  <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
    <span style={{fontFamily:df,fontSize:12.5,color:T.textSecondary}}>{label}</span>
    <span style={{fontFamily:mf,fontSize:12.5,color:T.textPrimary}}>{value}</span>
  </div>
);

function ReviewsTab({config,logs}){
  const hs=scoredFor(config);
  function build(days){
    let c=todayKey();const ks=[];for(let i=0;i<days;i++){ks.unshift(c);c=addDays(c,-1);}
    const wd=ks.filter(k=>logs[k]);const scores=wd.map(k=>dayScore(config,logs[k]));
    const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
    const cmp=ks.length?Math.round((wd.filter(k=>dayScore(config,logs[k])>=70).length/ks.length)*100):0;
    const hst=hs.map(h=>{const hits=wd.filter(k=>{const v=logs[k][h.id];return h.type==="counter"?v>=h.target:v===true;}).length;return{name:h.name,pct:wd.length?Math.round((hits/wd.length)*100):0};});
    const best=hst.slice().sort((a,b)=>b.pct-a.pct)[0],worst=hst.slice().sort((a,b)=>a.pct-b.pct)[0];
    let lng=0,cur=0,pk=null;ks.forEach(k=>{const s=logs[k]?dayScore(config,logs[k]):0;if(s>=70){cur=pk&&addDays(pk,1)===k?cur+1:1;lng=Math.max(lng,cur);}else cur=0;pk=k;});
    return{avg,cmp,best,worst,lng,wdc:wd.length};
  }
  const W=build(7),M=build(30);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <ST>This Week</ST>
      <Card style={{display:"flex",flexDirection:"column",gap:8}}>
        <RR label="Overall Score" value={`${W.avg}/100`}/>
        <RR label="Completion" value={`${W.cmp}%`}/>
        <RR label="Longest Streak" value={`${W.lng}d`}/>
        {W.best&&<RR label="Best Habit" value={W.best.name}/>}
        {W.worst&&<RR label="Weakest Habit" value={W.worst.name}/>}
        <div style={{marginTop:8,padding:12,background:T.emberSoft,borderRadius:12}}>
          <div style={{fontFamily:df,fontSize:12.5,color:T.textPrimary,lineHeight:1.6}}>
            {W.wdc===0?"No entries yet — start today, one habit at a time.":W.avg>=85?`Strong week. You averaged ${W.avg}/100 with a ${W.lng}-day run.`:`You averaged ${W.avg}/100. Focus on "${W.worst?W.worst.name:"your weakest habit"}".`}
          </div>
        </div>
      </Card>
      <ST>This Month</ST>
      <Card style={{display:"flex",flexDirection:"column",gap:8}}>
        <RR label="Average Score" value={`${M.avg}/100`}/>
        <RR label="Completion" value={`${M.cmp}%`}/>
        <RR label="Longest Streak" value={`${M.lng}d`}/>
        {M.best&&<RR label="Best Habit" value={M.best.name}/>}
        {M.worst&&<RR label="Weakest Habit" value={M.worst.name}/>}
        <div style={{marginTop:4,padding:8,background:T.borderSoft,borderRadius:12}}><CalHeat config={config} logs={logs} weeks={5}/></div>
      </Card>
    </div>
  );
}

// ─── PROFILE TAB ──────────────────────────────────────────────────────────────
function ProfileTab({config,setConfig,logs}){
  const [ew,setEw]=React.useState(false);
  const [showAddHabit,setShowAddHabit]=React.useState(false);
  const tk=todayKey(),cs=curStreak(config,logs,tk),ls=longestStreak(config,logs);
  const elite=Object.keys(logs).filter(k=>dayScore(config,logs[k])>=95).length;
  const td=Object.keys(logs).length,avg=td?Math.round(Object.keys(logs).reduce((s,k)=>s+dayScore(config,logs[k]),0)/td):0;
  const upP=(f,v)=>setConfig({...config,profile:{...config.profile,[f]:v}});
  const upH=(id,p)=>setConfig({...config,habits:config.habits.map(h=>h.id===id?{...h,points:p}:h)});
  const rmH=id=>setConfig({...config,habits:config.habits.filter(h=>h.id!==id)});
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <Card style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:54,height:54,borderRadius:"50%",background:T.emberSoft,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <Icon name="user" size={24} color={T.ember}/>
        </div>
        <div style={{flex:1}}>
          <input value={config.profile.name} onChange={e=>upP("name",e.target.value)} placeholder="Your name"
            style={{background:"transparent",border:"none",fontFamily:df,fontWeight:700,fontSize:16,color:T.textPrimary,width:"100%",outline:"none"}}/>
          <div style={{fontFamily:mf,fontSize:11,color:T.textTertiary,marginTop:2}}>Forge your best self</div>
        </div>
      </Card>
      <div style={{display:"flex",gap:12}}>
        <StatCard icon={<Icon name="flame" size={16} color={T.ember}/>} label="Current Streak" value={`${cs}d`}/>
        <StatCard icon={<Icon name="award" size={16} color={T.steel}/>} label="Longest Streak" value={`${ls}d`}/>
      </div>
      <div style={{display:"flex",gap:12}}>
        <StatCard icon={<Icon name="sparkles" size={16} color={T.ember}/>} label="Elite Days" value={`${elite}`}/>
        <StatCard icon={<Icon name="trending_up" size={16} color={T.textSecondary}/>} label="Overall Avg" value={`${avg}`}/>
      </div>
      <ST>Body</ST>
      <Card style={{display:"flex",flexDirection:"column",gap:10}}>
        {[["Height (cm)","height"],["Goal Weight (kg)","goalWeight"]].map(([label,field])=>(
          <div key={field} style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{fontFamily:df,fontSize:12.5,color:T.textSecondary}}>{label}</span>
            <input value={config.profile[field]||""} onChange={e=>upP(field,e.target.value)}
              style={{width:90,background:T.surfaceRaised,border:`1px solid ${T.border}`,borderRadius:8,color:T.textPrimary,fontFamily:mf,fontSize:12,padding:"6px 8px",textAlign:"right",outline:"none"}}/>
          </div>
        ))}
      </Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <ST>Habits &amp; Scoring</ST>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={()=>setShowAddHabit(true)}
            style={{display:"flex",alignItems:"center",gap:5,background:T.emberSoft,border:"none",borderRadius:8,cursor:"pointer",padding:"5px 10px"}}>
            <Icon name="plus" size={13} color={T.ember}/>
            <span style={{fontFamily:df,fontSize:11,color:T.ember,fontWeight:600}}>Add Habit</span>
          </button>
          <button onClick={()=>setEw(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",padding:4}}><Icon name="pencil" size={13} color={T.textTertiary}/></button>
        </div>
      </div>
      {ew&&(
        <Card style={{display:"flex",flexDirection:"column",gap:10}}>
          {config.habits.map(h=>(
            <div key={h.id} style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:df,fontSize:12.5,color:T.textPrimary,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{h.name}</div>
                <div style={{fontFamily:mf,fontSize:10,color:T.textTertiary}}>{h.category}</div>
              </div>
              <input type="number" value={h.points} onChange={e=>upH(h.id,Number(e.target.value))}
                style={{width:48,background:T.surfaceRaised,border:`1px solid ${T.border}`,borderRadius:8,color:T.textPrimary,fontFamily:mf,fontSize:11,padding:"5px",textAlign:"center",outline:"none"}}/>
              <button onClick={()=>rmH(h.id)} style={{background:"none",border:"none",cursor:"pointer",padding:2}}><Icon name="trash" size={13} color={T.textTertiary}/></button>
            </div>
          ))}
        </Card>
      )}
      {showAddHabit&&<AddHabitModal config={config} setConfig={setConfig} onClose={()=>setShowAddHabit(false)}/>}

      <ST>Data &amp; Backup</ST>
      <Card style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontFamily:df,fontSize:12.5,color:T.textSecondary,lineHeight:1.6}}>
          Export saves everything — all your logs, habits, goals and settings — as a JSON file. Import restores it. Do this occasionally to keep a backup safe.
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>{
            const payload=JSON.stringify({config,logs},null,2);
            const blob=new Blob([payload],{type:"application/json"});
            const url=URL.createObjectURL(blob);
            const a=document.createElement("a");
            const date=new Date().toISOString().slice(0,10);
            a.href=url;a.download=`forge-backup-${date}.json`;
            document.body.appendChild(a);a.click();
            document.body.removeChild(a);URL.revokeObjectURL(url);
          }} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:12,background:T.emberSoft,border:`1px solid ${T.ember}44`,cursor:"pointer"}}>
            <Icon name="trending_up" size={15} color={T.ember}/>
            <span style={{fontFamily:df,fontWeight:600,fontSize:13,color:T.ember}}>Export Backup</span>
          </button>
          <button onClick={()=>{
            const input=document.createElement("input");
            input.type="file";input.accept=".json";
            input.onchange=e=>{
              const file=e.target.files[0];if(!file)return;
              const reader=new FileReader();
              reader.onload=ev=>{
                try{
                  const data=JSON.parse(ev.target.result);
                  if(data.config&&data.logs){
                    setConfig({...defaultConfig,...data.config,profile:{...defaultConfig.profile,...(data.config.profile||{})}});
                    setLogs(data.logs);
                    alert("✅ Backup restored successfully!");
                  } else {
                    alert("❌ Invalid backup file.");
                  }
                }catch(err){alert("❌ Could not read file.");}
              };
              reader.readAsText(file);
            };
            document.body.appendChild(input);input.click();document.body.removeChild(input);
          }} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"12px",borderRadius:12,background:T.surfaceRaised,border:`1px solid ${T.border}`,cursor:"pointer"}}>
            <Icon name="plus" size={15} color={T.textSecondary}/>
            <span style={{fontFamily:df,fontWeight:600,fontSize:13,color:T.textSecondary}}>Import Backup</span>
          </button>
        </div>
        <div style={{fontFamily:mf,fontSize:10.5,color:T.textTertiary,lineHeight:1.5}}>
          Tip: export once a week. Store the file in iCloud, Google Drive, or your Notes app.
        </div>
      </Card>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
const TABS=[
  {id:"dashboard",label:"Home",   icon:"home"},
  {id:"today",    label:"Today",  icon:"check"},
  {id:"progress", label:"Progress",icon:"trending_up"},
  {id:"goals",    label:"Goals",  icon:"target"},
  {id:"reviews",  label:"Reviews",icon:"calendar"},
  {id:"profile",  label:"Profile",icon:"user"},
];

function Forge(){
  const [tab,setTab]=React.useState("dashboard");
  const [config,setConfig]=React.useState(defaultConfig);
  const [logs,setLogs]=React.useState({});
  const [loaded,setLoaded]=React.useState(false);
  const [selDate,setSelDate]=React.useState(todayKey());
  const [quote]=React.useState(()=>{const l=QUOTES;return l[Math.floor(Math.random()*l.length)];});

  React.useEffect(()=>{(async()=>{const[c,l]=await Promise.all([loadCfg(),loadLogs()]);setConfig(c);setLogs(l);setLoaded(true);})();},[]);
  React.useEffect(()=>{if(loaded)saveCfg(config);},[config,loaded]);
  React.useEffect(()=>{if(loaded)saveLogs(logs);},[logs,loaded]);

  if(!loaded)return(
    <div style={{background:T.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12}}>
        <Icon name="flame" size={28} color={T.ember}/>
        <div style={{fontFamily:mf,color:T.textTertiary,fontSize:13,letterSpacing:1}}>WARMING THE FORGE…</div>
      </div>
    </div>
  );

  return (
    <div style={{background:T.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column",fontFamily:df}}>
      <div style={{padding:"20px 18px 8px",display:"flex",alignItems:"center",gap:8,borderBottom:`1px solid ${T.borderSoft}`}}>
        <Icon name="flame" size={20} color={T.ember}/>
        <span style={{fontFamily:df,fontWeight:800,fontSize:16,color:T.textPrimary,letterSpacing:.5}}>FORGE</span>
        {config.profile.name&&<span style={{fontFamily:df,fontSize:13,color:T.textTertiary,marginLeft:4}}>· {config.profile.name}</span>}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px 16px 100px"}}>
        {tab==="dashboard"&&<DashboardTab config={config} logs={logs} quote={quote}/>}
        {tab==="today"&&<TodayTab config={config} setConfig={setConfig} logs={logs} setLogs={setLogs} selDate={selDate} setSelDate={setSelDate}/>}
        {tab==="progress"&&<ProgressTab config={config} logs={logs}/>}
        {tab==="goals"&&<GoalsTab config={config} setConfig={setConfig} logs={logs}/>}
        {tab==="reviews"&&<ReviewsTab config={config} logs={logs}/>}
        {tab==="profile"&&<ProfileTab config={config} setConfig={setConfig} logs={logs}/>}
      </div>
      <div style={{position:"sticky",bottom:0,background:`${T.surface}F5`,backdropFilter:"blur(12px)",borderTop:`1px solid ${T.border}`,display:"flex",padding:"8px 4px 10px"}}>
        {TABS.map(t=>{const a=tab===t.id;return(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",padding:"6px 0",borderRadius:10,transition:"background .15s",...(a?{background:T.emberSoft}:{})}}>
            <Icon name={t.icon} size={20} color={a?T.ember:T.textTertiary} sw={a?2.4:2}/>
            <span style={{fontFamily:mf,fontSize:9.5,color:a?T.ember:T.textTertiary,letterSpacing:.3}}>{t.label}</span>
          </button>
        );})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Forge/>);
</script>
</body>
